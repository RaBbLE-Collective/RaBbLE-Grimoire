epoch: 0
name: "Foundation"
status: active
started: 2026-04-28

episode_pending: 1
episode_name: "First Coordination Sweep"
episode_note: >
  Events are accumulating toward Episode 1 — not yet aired. Episode 1 airs
  when it feels like a coherent stable-ish point across the ecosystem: members
  bootstrappable, session entry points lean, Grimoire as established source of
  truth. Will be tagged v0.0.0.1 across aligned repos simultaneously.

version_current: "v0.0.0.0"
version_next: "v0.0.0.1"

# ── Episode/Plot structure ────────────────────────────────────────────────────
# During Episode 1: all active projects accumulate events in Plots (A, B, C...).
# Plots reference the episode they belong to: "Episode 1, Plot A".
# Episode 1 airs simultaneously across the Collective.
#
# ── Echo coherence policy ─────────────────────────────────────────────────────
# After Episode 1 airs, per-project episode tracks may diverge.
# Echo-level versioning is maintained in lockstep: no project should be more
# than ~1-2 episodes ahead of others toward the Echo milestone (~12 episodes).
# The Grimoire tracks Collective episode position and flags divergence.
episode_coherence_policy: >
  During Episode 1: Collective-wide lockstep. All projects air Episode 1 together.
  Episodes 2+: per-project pacing allowed but Grimoire maintains coherence.
  Max divergence: ~1-2 episodes. Echo (~12 episodes) targeted collectively.

intent: >
  Establish the Collective coordination layer. Define the structure,
  conventions, and philosophy before building anything.
  Every project exists as a registered scaffold. Nothing is wired yet.
  This epoch is complete when the Collective can bootstrap itself.

exit_condition: >
  RaBbLE-Collective repo committed and pushed to GitHub.
  All project repos initialized, registered in manifests, and cloneable.
  setup.sh verified against live repos.
  AGENT.md Project Index reflects real repo URLs.
  Each project has AGENT.md, CONTEXT.md, REFERENCES.md, and workspace structure.
  Ready to begin Epoch 1 active development.

focus:
  RaBbLE-Collective:
    priority: primary
    milestone: "Coordination layer committed and operational"
    active_work:
      - Initial commit to GitHub
      - Verify setup.sh against live repos
      - Update manifest repo URLs from TBD to real remotes

  RaBbLE-OS:
    priority: scaffold
    milestone: "Repo structure aligned to Collective conventions"
    active_work:
      - AGENT.md, CONTEXT.md, REFERENCES.md in place
      - Workspace structure (planning/, src/, grimoire/, ops/) present
      - Manifest URL confirmed

  RaBbLE-WEB:
    priority: scaffold
    milestone: "Repo initialized and registered"
    active_work:
      - GitHub repo created
      - new-member.sh run to scaffold structure
      - Manifest URL updated from TBD

  RaBbLE-Frontend:
    priority: scaffold
    milestone: "Repo initialized and registered"
    active_work:
      - GitHub repo created
      - new-member.sh run to scaffold structure
      - Manifest URL updated from TBD
