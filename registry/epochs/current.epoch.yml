epoch: 0
name: "Foundation"
status: active
started: 2026-04-28

# Episodes were retired as the planning unit (Mark, S318 D3; applied S322).
# Members plan by milestone (focus: below). The Collective marks stability with
# Echoes. Spec: RaBbLE-Versioning.md. Arc names are lore, not gates.
arc: "Genesis"
arc_crossed: 2026-11-09      # joinrabble.world first deployed from main (World PR #2, S318)
arc_next: "Exodus"           # observation, memory, the first closed behavioral loop

version_collective: "v0.0.0" # Epoch.Evolution.Echo; the fourth slot is per member

# Members with `release_track: lockstep` in their manifest work on this branch;
# spells/status.sh flags any that are not. `independent` members are exempt.
# main = release: reach it by pull request only (World main deploys production).
active_branch: "new-horizons"

intent: >
  Establish the coordination layer, the identity, the visual system and a public
  door. Expression first: a face, a voice, a substrate.

exit_condition: >
  Epoch 0 ends at the first closed loop: with the laptop offline, RaBbLE observes
  something, stores it, recalls it and expresses it. Named in hindsight.
exit_evidence:
  - "DONE  joinrabble.world live from main: entity face + live sCoRE chat (S318)"
  - "DONE  sCoRE deployed and reachable (S106)"
  - "DONE  Aether + NeBuLA served from their CDN subdomains (S153)"
  - "OPEN  setup.sh end to end on a fresh VM"
  - "OPEN  OS fresh install passes after the S318 Ansible findings are fixed"
  - "OPEN  first closed loop (log/plans/Collective-Context-Diet-S322.md, section 6)"

