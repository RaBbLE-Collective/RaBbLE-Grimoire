episode_pending: 1
episode_name: "Genesis"
episode_note: >
  Events are accumulating toward Episode 1 — not yet aired. Episode 1 airs
  when it feels like a coherent stable-ish point across the ecosystem: members
  bootstrappable, session entry points lean, Grimoire as established source of
  truth, joinrabble.world live with sCoRE wired. Will be tagged
  episode-1-v0.0.0.1 across all active repos simultaneously.

version_current: "v0.0.0.0"
version_next: "v0.0.0.1"

# Pre-episode convergence branch. Every member on `release_track: episode`
# (see registry/manifests/) works here until Episode 1 airs, then merges to
# main and tags episode-1-v0.0.0.1 simultaneously. `spells/status.sh` flags any
# lockstep member NOT on this branch as off-track. Members on
# `release_track: independent` (sandbox/archive) are exempt.
active_branch: "new-horizons"

# ── Episode/Plot structure ────────────────────────────────────────────────────
# During Episode 1: all active projects accumulate Events in Plots (A, B, C...).
# Plots reference the episode they belong to: "Episode 1, Plot A".
# Episode 1 airs simultaneously across the Collective.
#
# ── Echo coherence policy ─────────────────────────────────────────────────────
# After Episode 1 airs, per-project episode tracks may diverge.
# Echo-level versioning is maintained in lockstep: no project should be more
# than ~1-2 episodes ahead of others toward the Echo milestone (~12 episodes).
# The Grimoire tracks Collective episode position and flags divergence.
episode_coherence_policy: >
  During Episode 1: Collective-wide lockstep. All projects air Episode 1 together.
  A member may air Episode 1 as a labeled Developer Preview (a reduced, explicit
  bar) without holding back the lockstep, provided its rough edges are documented
  and it meets its declared preview floor. (RaBbLE-OS, Episode 1 — decided S109.)
  Episodes 2+: per-project pacing allowed but Grimoire maintains coherence.
  Max divergence: ~1-2 episodes. Echo (~12 episodes) targeted collectively.

intent: >
  Establish the Collective coordination layer. Define the structure,
  conventions, and philosophy before building anything. Identity locked.
  Visual system (Aether + NeBuLA) built. Web presence live. sCoRE deployed.
  This epoch is complete when joinrabble.world is live and bootstrappable.

exit_condition: >
  joinrabble.world is live — landing page, entity visual, basic chat wired to sCoRE.
  sCoRE is deployed to Render and reachable.
  RaBbLE-OS airs as a labeled Developer Preview — "enter at your own risk,
  unstable vibes." Installs, recovers, and is daily-survivable on a generic
  x86_64 machine (VM-verified) by a Linux + tiling-WM-literate user willing to
  tolerate quirks, with known rough edges documented. Full reproducible polish
  bakes toward Episode 2 (Exodus).
  All active member repos tagged episode-1-v0.0.0.1 simultaneously.
  Collective bootstrap (bootstrap.sh) verified end-to-end.

