# Identity
name: RaBbLE-sCoRE
slug: RaBbLE-sCoRE
description: "Coordination intelligence engine + FastAPI web API. Intent → decompose → delegate → result."
role: server

# Repository
repo: https://github.com/markm1206/RaBbLE-sCoRE.git
branch: main
worktree_root: RaBbLE-sCoRE

# Status
version: "v0.0.0.0"
epoch: 0
evolution: 0
echo: 0
episode: 0
episode_name: "First Air (pending)"
status: active

# Grimoire
grimoire_sync: true
grimoire_path: grimoire/

# Collective alignment
palette_version: "1.0"
entity_embedded: true
pulse_protocol: true

# Subcomponents
