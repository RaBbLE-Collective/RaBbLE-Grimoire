# manifests/RaBbLE-Collective.manifest.yml
# The root repo. Entry point into the entire RaBbLE ecosystem.
# Maps to ~/RaBbLE-Collective/ — the working directory root on any machine.

# Identity
name: RaBbLE-Collective
slug: RaBbLE-Collective
description: "Root entry layer. Bootstrap + identity. The door to the ecosystem."
role: root

# Repository
repo: git@github.com:RaBbLE-Collective/RaBbLE-Collective.git
branch: main
worktree_root: ~/RaBbLE-Collective

# Status
phase: 0
epoch: 0
status: active
release_track: episode      # airs in Episode lockstep — tracks epoch active_branch

# Collective alignment
palette_version: "1.0"
entity_embedded: true
pulse_protocol: true

# Notes
notes: >
  Established 2026-05-06. GitHub repo: RaBbLE-Collective/RaBbLE-Collective.
  Old content archived to archive/v0-collective-scaffold and archive/reliquary-grimoire-site.
  This repo IS the ~/RaBbLE-Collective/ root — not a subdirectory within it.
  Contains bootstrap.sh (curl-able entry spell) and identity docs only.
  All member repos live as nested independent git trees, .gitignored by Collective.
  See RaBbLE-Collective/RaBbLE-Collective-Plan.md for full architecture.
