slug: RaBbLE-NeBuLA
description: "Flat-Chaos quantum visual renderer — the entity's ambient visual expression environment."
role: frontend

# Repository
repo: https://github.com/markm1206/RaBbLE-NeBuLA.git
branch: main
worktree_root: RaBbLE-NeBuLA

# Status
