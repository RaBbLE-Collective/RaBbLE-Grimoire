  Registers on World pages via the IIFE bundle loaded from CDN.
  Episode 1 deliverable: Canvas2D entity renderer at 60 FPS, CDN-ready bundle.
  Three.js Layer 2 deferred to Episode 2+.
  Original NeBuLA-JS code archived in RaBbLE-Xperimental.
  Lore + architecture specs live in RaBbLE-Grimoire/RaBbLE-NeBuLA/.
  HTTPS remote (not SSH) — note for setup.sh clone logic.
