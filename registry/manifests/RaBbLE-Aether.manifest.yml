# manifests/RaBbLE-Aether.manifest.yml
# Visual design system and canonical asset library for the RaBbLE Collective.
# Produces the CSS bundle (rabble.css) consumed by RaBbLE-World and other members.

# Identity
name: RaBbLE-Aether
slug: RaBbLE-Aether
description: "Canonical design system — palette tokens, typography, motion, components, CSS bundle."
role: design-system

# Repository
repo: git@github.com:markm1206/RaBbLE-Aether.git
branch: main
worktree_root: RaBbLE-Aether

# Status
epoch: 0
status: active

# Grimoire
grimoire_sync: true
grimoire_path: grimoire/

# Collective alignment
palette_version: "1.0"
entity_embedded: true
pulse_protocol: true

# Dependencies — other Collective members this member consumes
depends_on: []
# Aether is a leaf — it consumes Grimoire palette tokens only (not a runtime dep).

# Notes
notes: >
  Active branch: dev. CSS bundle (rabble.css) is generated by the cast-aether spell.
  rabble.css is a build artifact — dev source only in this repo, bundle consumed by others.
  RaBbLE-World already imports the aether bundle. Other members should reference the cast output.
  Palette source of truth: RaBbLE-Grimoire/RaBbLE-Agent/RaBbLE-Palette.md — never invent hex values.
