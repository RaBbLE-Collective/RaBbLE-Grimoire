# manifests/RaBbLE-World.manifest.yml
# Web presence and entity chat surface. joinrabble.world.
# Includes RaBbLE-Chat and the Layer 1 entity renderer (rabble-entity.js).

# Identity
name: RaBbLE-World
slug: RaBbLE-World
description: "Web presence + entity chat surface + Layer 1 entity renderer. joinrabble.world."
role: frontend

# Repository
repo: git@github.com:markm1206/RaBbLE-World.git
branch: main
worktree_root: RaBbLE-World

# Status
epoch: 0
status: active

# Grimoire
grimoire_sync: true
grimoire_path: grimoire/

# Collective alignment
palette_version: "1.0"
entity_embedded: true
pulse_protocol: true

# Notes
notes: >
  Active branch: dev. Deployed at joinrabble.world via Cloudflare Workers.
  World is a thin scaffold: HTML + loaders. No embedded renderers or visual effects.
  Entity rendering: <rabble-entity> web component from NeBuLA (loaded via loader script).
  Visual effects: all from Aether CSS bundle (loaded via loader script).
  Two loaders in <head>: RaBbLE-aether.js (injects Aether CSS), RaBbLE-NeBuLA.js (injects NeBuLA IIFE).
  Both loaders show failure banners — degraded mode is visible, never silent.
  Pages link to /aether/v0.0.0.0/aether.css (dev) — watch build output, not aether.min.css.
